[package]
name = "viva-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "General-purpose Rust process-bigraph engine (bigraph-schema + process-bigraph) as a PyO3 wheel; runs process-bigraph models with Python processes, bit-identical to pb 1.8.3; validated on real v2ecoli models"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# The PyO3 extension-module can't link a standalone test harness (no libpython);
# it is exercised through `python/tests` under `.venv-m1`, not `cargo test`.
test = false
doctest = false

[dependencies]
bigraph-schema-rs = { path = "../bigraph-schema-rs" }
process-bigraph-rs = { path = "../process-bigraph-rs" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17.2"
