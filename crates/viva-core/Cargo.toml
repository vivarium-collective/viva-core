[package]
name = "viva-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 wheel: the Rust process-bigraph engine running real v2ecoli .pbg models with Python processes (quadrant 3)"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
# The PyO3 extension-module can't link a standalone test harness (no libpython);
# it is exercised through `python/tests` under `.venv-m1`, not `cargo test`.
test = false
doctest = false

[features]
# Native metabolism FBA solve links GLPK (a hard C dependency). OFF by default
# so the wheel builds without GLPK; enable with `maturin develop --features glpk`
# (GLPK headers/lib at /opt/homebrew, overridable via GLPK_LIB_DIR). build.rs
# only emits link flags when this feature is on.
glpk = []

[dependencies]
bigraph-schema-rs = { path = "../bigraph-schema-rs" }
process-bigraph-rs = { path = "../process-bigraph-rs" }
pyo3 = { version = "0.29.0", features = ["extension-module"] }
numpy = "0.29"
ndarray = "0.17.2"
