[package]
name = "process-bigraph-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust scheduler, tick loop and emitters mirroring process-bigraph 1.8.3 execution order"

[dependencies]
bigraph-schema-rs = { path = "../bigraph-schema-rs" }
thiserror = "1"
rayon = "1.10"
# rsmpi links the system MPI (Homebrew Open MPI 5: `brew install open-mpi`);
# it finds it via `mpicc` on PATH, no env var needed. Used only by the
# standalone `mpi_smoke` binary behind the opt-in `mpi` feature (off by default,
# so the PyO3 wheel never compiles mpi-sys). Build: `--features mpi`.
mpi = { version = "0.8", optional = true }

[[bin]]
name = "mpi_smoke"
path = "src/bin/mpi_smoke.rs"
required-features = ["mpi"]

[features]
default = []
mpi = ["dep:mpi"]

[dev-dependencies]
serde_json = "1"
