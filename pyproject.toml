[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "viva_core"
requires-python = ">=3.10"
description = "General-purpose Rust process-bigraph engine (bigraph-schema + process-bigraph) as a PyO3 wheel; runs process-bigraph models with Python processes, bit-identical to pb 1.8.3; validated on real v2ecoli models"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# The PyO3 cdylib lives in the workspace crate; build that one into the wheel.
manifest-path = "crates/viva-core/Cargo.toml"
python-source = "python"
module-name = "viva_core._native"
